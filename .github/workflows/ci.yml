# CI (11-19). GitHub's runners have no GPU, so CI checks what can be checked without one:
#   cpu:  the CPU tests (storage formats, reference attention; GPU tests skip) and a lint for errors only
#   cuda: every CUDA kernel compiles for sm_90a with the toolchain the vLLM plugin uses (nvcc 13.2, torch 2.14 cu130),
#         in the nvidia/cuda devel image run with docker (a job-level container ran out of disk)
# The GPU suite (kernels against FP32 references, the plugin end to end in vLLM) runs on an H200 through Slurm:
#   slurm/gpu_tests.sbatch (see README, "Tests").
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy ruff==0.17.6
      - name: Lint (errors only)
        # library code: syntax errors and undefined names; the bench scripts only syntax (their timing loops `del` a
        # tensor after a lambda used it, which F821 reports although the lambda has run by then)
        run: |
          ruff check --select E9,F63,F7,F82 --output-format=github kv4 tests tools integrations paper
          ruff check --select E9,F63,F7 --output-format=github bench
      - name: Tests
        run: python -m pytest -q -rs
  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # the CUDA devel image (~8 GB) plus torch cu130 (~4 GB) does not fit next to the runner's preinstalled SDKs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build the CUDA kernels (sm_90a) with nvcc 13.2 and torch 2.14.0 cu130
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TORCH_CUDA_ARCH_LIST=9.0a -e MAX_JOBS=4 -e PYTHONPATH=/src \
            nvidia/cuda:13.2.0-devel-ubuntu24.04 bash -euo pipefail -c '
              apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-venv python3-dev >/dev/null
              python3 -m venv /opt/venv
              /opt/venv/bin/pip install -q --no-cache-dir torch==2.14.0 --index-url https://download.pytorch.org/whl/cu130
              /opt/venv/bin/pip install -q --no-cache-dir ninja numpy
              export PATH=/opt/venv/bin:$PATH  # the torch JIT build calls ninja from PATH
              python tools/build_kernels.py'
